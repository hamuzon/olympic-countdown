name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GA_MEASUREMENT_ID: G-F8HVYVW05H

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Restore Nuxt cache
        uses: actions/cache@v6
        with:
          path: |
            .nuxt
            node_modules/.cache
          key: ${{ runner.os }}-nuxt-build-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-build-

      - name: Build
        run: npm run generate

      - name: Inject Google Analytics 4
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GA_MEASUREMENT_ID" =~ ^G-[A-Z0-9]+$ ]]; then
            echo "Invalid GA4 measurement ID: $GA_MEASUREMENT_ID"
            exit 1
          fi

          export GA_ID="$GA_MEASUREMENT_ID"

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          ga_id = os.environ["GA_ID"]
          public_dir = Path(".output/public")
          snippet = f'''<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id={ga_id}"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){{dataLayer.push(arguments);}}
            gtag('js', new Date());
            gtag('config', '{ga_id}');
          </script>
          '''

          updated = 0
          skipped = 0

          for html_file in public_dir.rglob("*.html"):
              content = html_file.read_text(encoding="utf-8")

              if "googletagmanager.com/gtag/js" in content:
                  skipped += 1
                  continue

              match = re.search(r"<head(?:\s[^>]*)?>", content, re.IGNORECASE)
              if not match:
                  print(f"Skipped (no head): {html_file}")
                  skipped += 1
                  continue

              content = content[:match.end()] + "\n" + snippet + content[match.end():]
              html_file.write_text(content, encoding="utf-8")
              updated += 1

          print(f"GA4 injected: {updated} HTML file(s)")
          print(f"Skipped: {skipped} HTML file(s)")
          PY

      - name: Post-process and cleanup deployment artifact
        run: |
          cd .output/public
          rm -f README.md README readme.md license LICENSE LICENSE.txt _redirects.md _redirects

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ".output/public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
